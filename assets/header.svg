<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Cyan Glow -->
    <radialGradient id="glow-cyan" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Glow -->
    <radialGradient id="glow-emerald" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .title { font-weight: 700; font-size: 27px; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font-weight: 600; font-size: 15px; fill: #38bdf8; letter-spacing: 0.2px; }
    .desc { font-weight: 400; font-size: 12.5px; fill: #94a3b8; }
    .badge-text { font-weight: 600; font-size: 10px; fill: #34d399; letter-spacing: 0.8px; text-transform: uppercase; }
    .tag-text { font-weight: 500; font-size: 11px; fill: #cbd5e1; }
    .code-text { font-size: 11px; fill: #94a3b8; }
    .code-keyword { fill: #f43f5e; font-weight: 600; }
    .code-var { fill: #38bdf8; }
    .code-prop { fill: #a78bfa; }
    .code-str { fill: #34d399; }
    .code-bracket { fill: #fbbf24; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="238" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Grids & Ambient Glows -->
  <rect x="2" y="2" width="846" height="236" rx="13" fill="url(#grid)" />
  <rect x="2" y="2" width="846" height="236" rx="13" fill="url(#glow-cyan)" />
  <rect x="2" y="2" width="846" height="236" rx="13" fill="url(#glow-emerald)" />

  <!-- LEFT COLUMN: Profile Info -->
  <g transform="translate(36, 32)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="22" rx="11" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="12" cy="11" r="3.5" fill="#10b981" />
      <text x="24" y="14.5" class="font-sans badge-text">Available for Hire</text>
    </g>

    <!-- Name & Titles -->
    <text x="0" y="55" class="font-sans title">Biel</text>
    <text x="0" y="80" class="font-sans subtitle">Mobile Application Developer</text>
    <text x="0" y="103" class="font-sans desc">Muhamad Habil Putrawan &#8226; Cross-Platform &amp; RESTful APIs</text>

    <!-- Skill Tags -->
    <g transform="translate(0, 130)">
      <!-- Tag 1: Flutter -->
      <g transform="translate(0, 0)">
        <rect width="70" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
        <text x="35" y="16" text-anchor="middle" class="font-sans tag-text">Flutter</text>
      </g>
      <!-- Tag 2: Dart -->
      <g transform="translate(76, 0)">
        <rect width="56" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
        <text x="28" y="16" text-anchor="middle" class="font-sans tag-text">Dart</text>
      </g>
      <!-- Tag 3: Express -->
      <g transform="translate(138, 0)">
        <rect width="78" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
        <text x="39" y="16" text-anchor="middle" class="font-sans tag-text">Express.js</text>
      </g>
      <!-- Tag 4: Laravel -->
      <g transform="translate(222, 0)">
        <rect width="70" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
        <text x="35" y="16" text-anchor="middle" class="font-sans tag-text">Laravel</text>
      </g>
      <!-- Tag 5: PostgreSQL -->
      <g transform="translate(298, 0)">
        <rect width="88" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
        <text x="44" y="16" text-anchor="middle" class="font-sans tag-text">PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Code Card -->
  <g transform="translate(480, 26)">
    <!-- Terminal Window Container -->
    <rect width="338" height="188" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    
    <!-- Window Header -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 328 0 C 333.523 0 338 4.477 338 10 L 338 28 L 0 28 Z" fill="#1e293b" fill-opacity="0.7" />
    <circle cx="16" cy="14" r="4" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="28" cy="14" r="4" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="40" cy="14" r="4" fill="#10b981" fill-opacity="0.8" />
    <text x="169" y="18" text-anchor="middle" class="font-mono" font-size="10" fill="#64748b">developer.json</text>

    <!-- Code Content -->
    <g transform="translate(18, 48)" class="font-mono code-text">
      <text y="0"><tspan class="code-bracket">{</tspan></text>
      <text y="19"><tspan dx="12" class="code-prop">"name"</tspan>: <tspan class="code-str">"Biel (Habil Putrawan)"</tspan>,</text>
      <text y="38"><tspan dx="12" class="code-prop">"role"</tspan>: <tspan class="code-str">"Mobile App Developer"</tspan>,</text>
      <text y="57"><tspan dx="12" class="code-prop">"core"</tspan>: <tspan class="code-bracket">[</tspan><tspan class="code-str">"Flutter"</tspan>, <tspan class="code-str">"Dart"</tspan><tspan class="code-bracket">]</tspan>,</text>
      <text y="76"><tspan dx="12" class="code-prop">"backend"</tspan>: <tspan class="code-bracket">[</tspan><tspan class="code-str">"Laravel"</tspan>, <tspan class="code-str">"Express"</tspan><tspan class="code-bracket">]</tspan>,</text>
      <text y="95"><tspan dx="12" class="code-prop">"location"</tspan>: <tspan class="code-str">"Bandung, Indonesia"</tspan>,</text>
      <text y="114"><tspan dx="12" class="code-prop">"cleanCode"</tspan>: <tspan class="code-keyword">true</tspan></text>
      <text y="132"><tspan class="code-bracket">}</tspan></text>
    </g>
  </g>
</svg>